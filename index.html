<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayowait</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --term-green: #4ec9b0;
  --term-dim: #6a6a6a;
  --term-blue: #569cd6;
  --term-yellow: #dcdcaa;
  --term-red: #f44747;
  --term-purple: #c586c0;
  --desk-glow: rgba(86, 156, 214, 0.4);
  --desk-surface: rgba(22, 33, 62, 0.65);
  --desk-border: rgba(255, 255, 255, 0.08);
  --mint-green: #87af5f;
}

/* ============ 主题变量（默认深色） ============ */
:root {
  --bg: #000;
  --bg-soft: #0a0a12;
  --text: #fff;
  --text-dim: rgba(255,255,255,0.75);
  --text-faint: rgba(255,255,255,0.45);
  --text-ghost: rgba(255,255,255,0.2);
  --glass-bg: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.08);
  --glow-blue: rgba(86,156,214,0.15);
  --glow-mint: rgba(135,175,95,0.1);
  --glow-core: rgba(86,156,214,0.10);
  --glow-ring: rgba(86,156,214,0.06);
  --glow-fade: 0.85;
  --grid-line: rgba(255,255,255,0.02);
  --hero-grad: rgba(10,10,18,0.9);
  --dot-ring: rgba(255,255,255,0.4);
}
/* ============ 浅色主题 ============ */
html.light {
  --bg: #f5f5f7;
  --bg-soft: #eef0f4;
  --text: #111;
  --text-dim: rgba(0,0,0,0.75);
  --text-faint: rgba(0,0,0,0.45);
  --text-ghost: rgba(0,0,0,0.2);
  --glass-bg: rgba(0,0,0,0.03);
  --glass-border: rgba(0,0,0,0.1);
  --glow-blue: rgba(86,156,214,0.18);
  --glow-mint: rgba(135,175,95,0.15);
  --glow-core: rgba(86,156,214,0.14);
  --glow-ring: rgba(70,110,160,0.10);
  --glow-fade: 1;
  --grid-line: rgba(0,0,0,0.04);
  --hero-grad: rgba(240,240,244,0.9);
  --desk-glow: rgba(86, 156, 214, 0.16);
  --dot-ring: rgba(0,0,0,0.35);
}

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace;
  background: var(--bg); color: var(--text); overflow-x: hidden;
  transition: background 0.4s ease, color 0.4s ease;
}

/* ============================================================
   滚动方案：
   - 手机：纯 CSS scroll-snap mandatory，零 JS，浏览器原生最顺滑
   - 桌面：JS wheel 翻页
   ============================================================ */
@media (prefers-reduced-motion: no-preference) {
  @media (pointer: coarse) {
    html { scroll-snap-type: y mandatory; }
  }
}

@keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
@keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(10px);} }
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 20px 2px var(--desk-glow), 0 0 40px 4px var(--glow-ring); }
  50% { box-shadow: 0 0 30px 4px var(--desk-glow), 0 0 60px 8px var(--glow-core); }
}
@keyframes heroGlowPulse {
  0%,100% { opacity: calc(var(--glow-fade) * 0.7); transform: translate(-50%,-50%) scale(1); }
  50% { opacity: var(--glow-fade); transform: translate(-50%,-50%) scale(1.15); }
}
@keyframes heroGlowFloat {
  0%,100% { opacity: 0.5; transform: translate(0,0) scale(1); }
  50% { opacity: 0.8; transform: translate(-40px,30px) scale(1.2); }
}
@keyframes heroCardIn {
  from { opacity:0; transform: scale(0.92) translateY(15px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}
@keyframes windowIn {
  from { opacity:0; transform: translateY(12px) scale(0.98); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

/* ============ 主题切换（Codex 同款三色点，右上角固定悬浮） ============ */
.theme-dots {
  position: fixed; top: 14px; right: 16px; z-index: 9999;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 20px;
  background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.theme-dot {
  width: 13px; height: 13px; border-radius: 50%; border: none; padding: 0;
  cursor: pointer; position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.theme-dot:hover { transform: scale(1.25); }
.theme-dot:active { transform: scale(0.95); }
/* 激活态：外圈光环 */
.theme-dot.on { box-shadow: 0 0 0 2px var(--bg-soft), 0 0 0 3.5px var(--dot-ring), 0 0 10px 1px currentColor; }
.dot-red    { background: #ff5f56; color: #ff5f56; }
.dot-yellow { background: #ffbd2e; color: #ffbd2e; }
.dot-green  { background: #27c93f; color: #27c93f; }

/* ============ PAGE 1: Hero ============ */
.hero-page {
  height: 100vh; height: 100dvh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); position: relative; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always;
  transition: background 0.4s ease;
}
.hero-page::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(700px, 80vw); height: min(700px, 80vw);
  background: radial-gradient(circle, var(--glow-blue) 0%, var(--glow-core) 32%, transparent 65%);
  border-radius: 50%; pointer-events: none;
  animation: heroGlowPulse 6s ease-in-out infinite;
}
.hero-page::after {
  content: ''; position: absolute; top: 25%; left: 60%;
  width: min(350px, 40vw); height: min(350px, 40vw);
  background: radial-gradient(circle, var(--glow-mint) 0%, transparent 60%);
  border-radius: 50%; pointer-events: none;
  animation: heroGlowFloat 8s ease-in-out infinite;
}
html.light .hero-page::after { opacity: 1.4; }
.hero-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 50px 50px; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 15%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 15%, transparent 75%);
}
.hero-content { text-align: center; z-index: 2; position: relative; padding: 0 24px; }
.hero-emoji-wrap {
  display: inline-block; padding: 24px 64px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: 24px;
  margin-bottom: 44px; position: relative; overflow: hidden; opacity: 0;
  animation: heroCardIn 1s ease 0.3s forwards;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
}
.hero-emoji-wrap::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 30%, var(--glow-core) 0%, transparent 40%);
  pointer-events: none;
}
.hero-emoji-wrap::after {
  content: ''; position: absolute; bottom: 0; left: 10%; width: 80%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glow-ring), transparent);
}
.hero-emoji {
  font-size: clamp(56px, 12vw, 100px); font-weight: 200; color: var(--text);
  letter-spacing: -0.08em; line-height: 1; position: relative; z-index: 1;
  text-shadow: 0 0 30px var(--glow-blue);
}
.hero-emoji .cursor {
  display: inline-block; animation: blink 1s steps(2) infinite;
  color: var(--term-blue); text-shadow: 0 0 20px var(--glow-ring);
}
.hero-hello {
  font-size: clamp(16px, 3vw, 22px); font-weight: 300;
  color: var(--text-dim); letter-spacing: 0.06em;
  opacity: 0; animation: fadeUp 0.8s ease 0.8s forwards;
}
.scroll-hint {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
  color: var(--text-ghost); font-size: 11px; letter-spacing: 0.3em;
  text-transform: uppercase; opacity: 0; animation: fadeUp 1s ease 1.5s forwards;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.scroll-hint .arrow { font-size: 22px; animation: bounce 2s ease-in-out infinite; }
.scroll-gradient {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
  background: linear-gradient(to bottom, transparent 0%, var(--hero-grad) 100%);
  pointer-events: none; opacity: 0; animation: fadeIn 1.5s ease 0.5s forwards;
}

/* ============ PAGE 2: Mint Desktop ============ */
.desktop-page {
  min-height: 100vh; min-height: 100dvh; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg-soft); padding: 40px 16px 0; position: relative; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always;
  transition: background 0.4s ease;
}
.desktop-page::before {
  content: ''; position: absolute; top: -100px; right: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, var(--glow-blue) 0%, var(--glow-core) 35%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.desktop-page::after {
  content: ''; position: absolute; bottom: -50px; left: -50px;
  width: 350px; height: 350px;
  background: radial-gradient(circle, var(--glow-mint) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
html.light .desktop-page::before { opacity: 1.3; }
html.light .desktop-page::after { opacity: 1.3; }
.mint-panel {
  width: 100%; max-width: 740px; height: 36px;
  background: var(--glass-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-bottom: none;
  border-radius: 10px 10px 0 0;
  display: flex; align-items: center; padding: 0 16px; gap: 16px;
  font-size: 12px; color: var(--text-faint);
  opacity: 0; animation: fadeUp 0.6s ease 0.2s forwards;
}
.mint-panel-left { display: flex; align-items: center; gap: 12px; }
.mint-panel-center { margin: 0 auto; font-weight: 500; color: var(--text-dim); }
.mint-panel-right { display: flex; align-items: center; gap: 10px; }
.mint-menu-btn { display: flex; align-items: center; gap: 6px; color: var(--text-faint); }
.mint-logo-sm {
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, var(--mint-green), #4a7a2a);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff; font-weight: 700;
}
.mint-panel-right .icon { font-size: 11px; }
.desktop-area {
  width: 100%; max-width: 740px;
  background: var(--desk-surface);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: row; min-height: 480px; position: relative;
  opacity: 0; animation: fadeUp 0.8s ease 0.4s forwards;
}
.dock {
  width: 64px; background: rgba(0,0,0,0.25);
  border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 0; gap: 14px; flex-shrink: 0;
}
.dock-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; transition: all 0.25s ease;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.5); position: relative;
}
.dock-icon:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); color: #fff; transform: scale(1.1); }
.dock-icon.active { background: rgba(86,156,214,0.12); border-color: rgba(86,156,214,0.3); color: var(--term-blue); }
.dock-icon .badge {
  position: absolute; top: -2px; right: -2px; width: 14px; height: 14px;
  background: var(--term-red); border-radius: 50%; font-size: 8px; color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.workspace { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.avatar-section { display: flex; align-items: center; gap: 18px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); }
.avatar-orb {
  width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; position: relative;
  border: 2px solid rgba(86,156,214,0.3); animation: pulseGlow 3s ease-in-out infinite;
}
.avatar-orb img { width: 100%; height: 100%; object-fit: cover; }
.avatar-orb::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events: none;
}
.welcome-text { flex: 1; min-width: 0; }
.welcome-text .user { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 2px; }
.welcome-text .status { font-size: 12px; color: rgba(255,255,255,0.4); display: flex; align-items: center; gap: 6px; }
.status-dot { width: 7px; height: 7px; background: var(--mint-green); border-radius: 50%; box-shadow: 0 0 6px var(--mint-green); animation: blink 2s steps(2) infinite; }

/* 动态终端 */
.live-term {
  background: rgba(12,12,12,0.85); border: 1px solid #1f1f1f; border-radius: 8px; overflow: hidden;
  display: flex; flex-direction: column;
  animation: windowIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.live-term-bar { background: #1a1a1a; padding: 7px 12px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid #1f1f1f; flex-shrink: 0; }
.live-term-dots { display: flex; gap: 6px; }
.live-term-dots span { width: 11px; height: 11px; border-radius: 50%; }
.live-term-dots .r { background: #ff5f56; } .live-term-dots .y { background: #ffbd2e; } .live-term-dots .g { background: #27c93f; }
.live-term-title { font-size: 11px; color: #555; margin: 0 auto; padding-right: 45px; }
.live-term-body { padding: 16px; color: #e8e8e8; font-size: 13px; line-height: 1.6; overflow-y: auto; max-height: 400px; overscroll-behavior: contain; }
.live-term-body::-webkit-scrollbar { width: 6px; }
.live-term-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.lt-line { display: block; white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
.lt-empty { height: 0.75em; }
.lt-user { color: var(--term-green); } .lt-at { color: var(--term-dim); }
.lt-host { color: var(--term-blue); } .lt-path { color: var(--term-yellow); }
.lt-dollar { color: var(--term-dim); } .lt-cmd { color: #e8e8e8; }
.lt-output { color: rgba(255,255,255,0.6); }
.lt-green { color: var(--term-green); } .lt-blue { color: var(--term-blue); }
.lt-yellow { color: var(--term-yellow); } .lt-purple { color: var(--term-purple); }
.lt-dim { color: var(--term-dim); }
.lt-swirl { color: var(--term-red); }
.lt-cursor { display: inline-block; width: 7px; height: 14px; background: var(--term-green); vertical-align: middle; animation: blink 1s steps(2) infinite; }

.mint-taskbar {
  width: 100%; max-width: 740px; height: 40px;
  background: var(--glass-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-top: none; border-radius: 0 0 10px 10px;
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
  font-size: 11px; color: var(--text-faint);
  opacity: 0; animation: fadeUp 0.6s ease 0.6s forwards;
}
.task-item { padding: 4px 10px; border-radius: 6px; transition: all 0.2s; }
.task-item.active { background: rgba(86,156,214,0.1); color: rgba(255,255,255,0.8); border-bottom: 2px solid var(--term-blue); }
.task-sep { color: var(--text-ghost); margin: 0 2px; }
.task-clock { margin-left: auto; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.task-clock .date { color: var(--text-ghost); }

/* ============ PAGE 3: About ============ */
.about-page {
  min-height: 100vh; min-height: 100dvh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); padding: 60px 24px;
  position: relative; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always;
  transition: background 0.4s ease;
}
.about-page::before {
  content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: min(600px, 70vw); height: min(600px, 70vw);
  background: radial-gradient(circle, var(--glow-blue) 0%, var(--glow-core) 32%, transparent 65%);
  border-radius: 50%; pointer-events: none;
  animation: heroGlowPulse 8s ease-in-out infinite;
}
html.light .about-page::before { opacity: 1.3; }
.about-card {
  max-width: 540px; width: 100%;
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 48px 40px; text-align: center; position: relative; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  opacity: 0; animation: fadeUp 0.8s ease 0.2s forwards;
}
.about-card::after {
  content: ''; position: absolute; bottom: 0; left: 10%; width: 80%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(86,156,214,0.3), transparent);
}
.about-avatar {
  width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 24px;
  border: 2px solid rgba(86,156,214,0.25); animation: pulseGlow 4s ease-in-out infinite; position: relative;
}
.about-avatar img { width: 100%; height: 100%; object-fit: cover; }
.about-name { font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 8px; position: relative; }
.about-tagline { font-size: 14px; color: var(--text-faint); margin-bottom: 32px; letter-spacing: 0.04em; position: relative; }
.about-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; position: relative; }
.about-link {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
  border: 1px solid var(--glass-border); border-radius: 999px;
  color: var(--text-faint); text-decoration: none; font-size: 13px; transition: all 0.3s ease;
}
.about-link:hover { color: var(--text); border-color: rgba(86,156,214,0.4); background: rgba(86,156,214,0.08); }
.about-link svg { width: 16px; height: 16px; fill: currentColor; }
.about-footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--glass-border); font-size: 11px; color: var(--text-ghost); position: relative; }
.about-footer a { color: var(--text-ghost); text-decoration: none; }

@media (max-width: 640px) {
  .hero-emoji { font-size: 64px; }
  .hero-emoji-wrap { padding: 18px 48px; margin-bottom: 36px; border-radius: 20px; }
  .hero-hello { font-size: 15px; }
  .scroll-gradient { height: 80px; }
  .desktop-page { padding: 24px 10px 0; }
  .mint-panel { height: 32px; font-size: 10px; padding: 0 10px; gap: 10px; }
  .mint-panel-center { font-size: 11px; }
  .desktop-area { flex-direction: row; min-height: 420px; }
  .dock { width: 52px; }
  .dock-icon { width: 36px; height: 36px; font-size: 16px; }
  .workspace { padding: 14px; gap: 14px; }
  .avatar-section { gap: 12px; padding-bottom: 14px; }
  .avatar-orb { width: 48px; height: 48px; }
  .welcome-text .user { font-size: 14px; }
  .welcome-text .status { font-size: 10px; }
  .live-term-body { padding: 12px; font-size: 10.5px; max-height: 320px; }
  .live-term-bar { padding: 5px 10px; }
  .live-term-dots span { width: 9px; height: 9px; }
  .live-term-title { font-size: 9px; padding-right: 35px; }
  .mint-taskbar { height: 36px; font-size: 10px; padding: 0 10px; }
  .task-item { padding: 3px 8px; }
  .about-card { padding: 36px 24px; border-radius: 16px; }
  .about-avatar { width: 64px; height: 64px; margin-bottom: 20px; }
  .about-name { font-size: 20px; }
  .about-tagline { font-size: 13px; }
  .about-link { padding: 8px 20px; font-size: 12px; }
}
@media (min-width: 1200px) {
  .hero-emoji { font-size: 96px; }
  .hero-emoji-wrap { padding: 28px 72px; }
  .hero-hello { font-size: 20px; }
}
</style>
</head>
<body>

<!-- 主题切换：Codex 同款三色点（红=深色 黄=跟随系统 绿=浅色） -->
<div class="theme-dots" id="themeDots" role="group" aria-label="Theme">
  <button class="theme-dot dot-red"    data-theme="dark"  aria-label="Dark theme"  title="深色"></button>
  <button class="theme-dot dot-yellow" data-theme="auto"  aria-label="Auto theme"  title="跟随系统"></button>
  <button class="theme-dot dot-green"  data-theme="light" aria-label="Light theme" title="浅色"></button>
</div>

<!-- PAGE 1: Hero -->
<section class="hero-page">
  <div class="hero-grid"></div>
  <div class="hero-content">
    <div class="hero-emoji-wrap">
      <div class="hero-emoji">&gt;<span class="cursor">_</span></div>
    </div>

<script>
/* ===== 主题切换（三色点：红=深色 黄=跟随系统 绿=浅色） ===== */
(function() {
  var dots = document.querySelectorAll('.theme-dot');
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  var mediaHandler = null;

  function apply(mode) {
    var light = mode === 'light' || (mode === 'auto' && mq.matches);
    document.documentElement.classList.toggle('light', light);
    dots.forEach(function(d) {
      d.classList.toggle('on', d.dataset.theme === mode);
    });
  }

  function currentMode() {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch(e) {}
    return saved || 'dark';
  }

  // 黄点（auto）：监听系统主题变化，实时跟随
  function bindAuto() {
    if (mediaHandler) mq.removeEventListener('change', mediaHandler);
    if (currentMode() === 'auto') {
      mediaHandler = function() { apply('auto'); };
      mq.addEventListener('change', mediaHandler);
    }
  }

  dots.forEach(function(d) {
    d.addEventListener('click', function() {
      var mode = d.dataset.theme;
      try { localStorage.setItem('theme', mode); } catch(e) {}
      apply(mode);
      bindAuto();
    });
  });

  apply(currentMode());
  bindAuto();
})();

/* ===== 时钟 ===== */
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  var el = document.getElementById('clock');
  if (el) el.textContent = h + ':' + m;
  var d = document.getElementById('date-text');
  if (d) {
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    d.textContent = days[now.getDay()] + ' ' + (now.getMonth()+1) + '/' + now.getDate();
  }
}
setInterval(updateClock, 1000);
updateClock();

/* ===== 第二页动态终端 ===== */
(function() {
  var U = '<span class="lt-user">ayowait</span><span class="lt-at">@</span><span class="lt-host">github</span><span class="lt-dollar">:</span><span class="lt-path">~</span><span class="lt-dollar">$</span> ';
  var lines = [
    {html: U + '<span class="lt-cmd">neofetch</span>', delay: 400},
    {html: '', delay: 100},
    {html:'<span class="lt-swirl">       _,met$$$$$gg.      </span><span class="lt-blue">ayowait</span><span class="lt-dim">@</span><span class="lt-blue">github</span>', delay: 40},

    {html:'<span class="lt-swirl">  ,g$$P"        """Y$.".  </span><span class="lt-yellow">OS</span>: Ayowait OS 1.0 x86_64', delay: 40},
    {html:'<span class="lt-swirl"> ,$$P\'              `$$$.  </span><span class="lt-yellow">Host</span>: GitHub Pages', delay: 40},

    {html:'<span class="lt-swirl">`d$$\'     ,$P\'   .    $$$  </span><span class="lt-yellow">Uptime</span>: <span id="lt-uptime">0s</span>', delay: 40},
    {html:'<span class="lt-swirl"> $$P      d$\'     ,    $$P  </span><span class="lt-yellow">Packages</span>: 42 (dpkg), 7 (npm)', delay: 40},
    {html:'<span class="lt-swirl"> $$:      $.   -    ,d$$\'  </span><span class="lt-yellow">Shell</span>: bash 5.2.15', delay: 40},
    {html:'<span class="lt-swirl"> $$;      Y$b._   _,d$P\'  </span><span class="lt-yellow">Resolution</span>: responsive', delay: 40},
    {html:'<span class="lt-swirl"> Y$$.    `.`"Y$$$$P"\'     </span><span class="lt-yellow">DE</span>: Mint Glass 20.3', delay: 40},
    {html:'<span class="lt-swirl"> `$$b      "-.__          </span><span class="lt-yellow">WM</span>: Mutter (XTerm.js)', delay: 40},
    {html:'<span class="lt-swirl">  `Y$$                    </span><span class="lt-yellow">Theme</span>: Dark / Minimal [GTK3]', delay: 40},
    {html:'<span class="lt-swirl">   `Y$$.                  </span><span class="lt-yellow">Icons</span>: Papirus-Dark', delay: 40},
    {html:'<span class="lt-swirl">     `$$b.                </span><span class="lt-yellow">Terminal</span>: gnome-terminal', delay: 40},
    {html:'<span class="lt-swirl">       `Y$$b.             </span><span class="lt-yellow">CPU</span>: render engine (virtual)', delay: 40},
    {html:'<span class="lt-swirl">          `"Y$b._         </span><span class="lt-yellow">GPU</span>: Canvas 2D / WebGL', delay: 40},
    {html:'<span class="lt-swirl">              `"""        </span><span class="lt-yellow">Coffee</span>: <span class="lt-green">always</span>', delay: 40},
    {html: '', delay: 200},
    {html: U + '<span class="lt-cmd">dmesg | tail -6</span>', delay: 400},
    {html:'<span class="lt-dim">[    0.000000]</span> <span class="lt-output">Booting Ayowait OS on github.io ...</span>', delay: 90},
    {html:'<span class="lt-dim">[    0.118334]</span> <span class="lt-output">kernel: page cache warm, css loaded</span>', delay: 90},
    {html:'<span class="lt-dim">[    0.318241]</span> <span class="lt-output">theme: glassmorphism module loaded</span>', delay: 90},
    {html:'<span class="lt-dim">[    0.574902]</span> <span class="lt-output">network: github.io link up, 42ms</span>', delay: 90},
    {html:'<span class="lt-dim">[    0.712005]</span> <span class="lt-output">dock: avatar registered as app icon</span>', delay: 90},
    {html:'<span class="lt-dim">[    1.204859]</span> <span class="lt-output">system ready. welcome, visitor.</span>', delay: 90},
    {html: '', delay: 150},
    {html: U + '<span class="lt-cursor"></span>', delay: 300}
  ];

  var container = document.getElementById('live-term');
  if (!container) return;
  var started = false;

  function typeNext(i) {
    if (i >= lines.length) return;
    var div = document.createElement('div');
    div.className = 'lt-line' + (lines[i].html === '' ? ' lt-empty' : '');
    div.innerHTML = lines[i].html;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    setTimeout(function() { typeNext(i + 1); }, lines[i].delay);
  }

  function start() {
    if (started) return;
    started = true;
    typeNext(0);
  }

  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(en) { if (en.isIntersecting) start(); });
    }, { threshold: 0.25 });
    obs.observe(container);
  } else { start(); }

  var t0 = Date.now();
  setInterval(function() {
    var el = document.getElementById('lt-uptime');
    if (el) el.textContent = Math.floor((Date.now() - t0) / 1000) + 's';
  }, 1000);
})();

/* ============================================================
   滚动方案：
   - 手机/触屏：原生 CSS scroll-snap（mandatory），零 JS
   - 桌面（鼠标）：wheel 拦截 + 逐页平滑滚动
   ============================================================ */
(function() {
  var pages = document.querySelectorAll('.hero-page, .desktop-page, .about-page');
  if (!pages.length) return;

  var isCoarse = window.matchMedia('(pointer: coarse)').matches;
  if (isCoarse) return; // 触屏不挂任何 JS，交给原生 snap

  var current = 0;
  var animating = false;

  function idxOf(el) {
    for (var i = 0; i < pages.length; i++) if (pages[i] === el) return i;
    return -1;
  }

  function go(i) {
    if (i < 0 || i >= pages.length || animating) return;
    animating = true;
    current = i;
    pages[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(function() { animating = false; }, 750);
  }

  var acc = 0, accTimer = null;
  window.addEventListener('wheel', function(e) {
    if (animating) { e.preventDefault(); return; }
    acc += e.deltaY;
    clearTimeout(accTimer);
    accTimer = setTimeout(function() { acc = 0; }, 120);
    if (Math.abs(acc) >= 50) {
      var dir = acc > 0 ? 1 : -1;
      acc = 0;
      go(current + dir);
    }
  }, { passive: false });

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') go(current + 1);
    if (e.key === 'ArrowUp' || e.key === 'PageUp') go(current - 1);
  });

  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(en) {
      if (en.isIntersecting && en.intersectionRatio > 0.5 && !animating) {
        current = idxOf(en.target);
      }
    });
  }, { threshold: [0.5] });
  pages.forEach(function(p) { obs.observe(p); });
})();
</script>
