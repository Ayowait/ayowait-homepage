<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayowait</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --term-green: #4ec9b0;
  --term-dim: #6a6a6a;
  --term-blue: #569cd6;
  --term-yellow: #dcdcaa;
  --term-red: #f44747;
  --term-purple: #c586c0;
  --desk-glow: rgba(86, 156, 214, 0.4);
  --desk-surface: rgba(22, 33, 62, 0.65);
  --desk-border: rgba(255, 255, 255, 0.08);
  --mint-green: #87af5f;
}

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-snap-type: y mandatory; }

body {
  font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace;
  background: #000; color: #fff; overflow-x: hidden;
}

@keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
@keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(10px);} }
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 20px 2px var(--desk-glow), 0 0 40px 4px rgba(86,156,214,0.15); }
  50% { box-shadow: 0 0 30px 4px var(--desk-glow), 0 0 60px 8px rgba(86,156,214,0.25); }
}
@keyframes heroGlowPulse {
  0%,100% { opacity: 0.7; transform: translate(-50%,-50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
}
@keyframes heroGlowFloat {
  0%,100% { opacity: 0.5; transform: translate(0,0) scale(1); }
  50% { opacity: 0.8; transform: translate(-40px,30px) scale(1.2); }
}
@keyframes heroCardIn {
  from { opacity:0; transform: scale(0.92) translateY(15px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}

/* ============ PAGE 1: Hero ============ */
.hero-page {
  height: 100vh; height: 100dvh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #000; position: relative; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always;
}
.hero-page::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(700px, 80vw); height: min(700px, 80vw);
  background: radial-gradient(circle, rgba(86,156,214,0.15) 0%, rgba(86,156,214,0.05) 30%, transparent 65%);
  border-radius: 50%; pointer-events: none;
  animation: heroGlowPulse 6s ease-in-out infinite;
}
.hero-page::after {
  content: ''; position: absolute; top: 25%; left: 60%;
  width: min(350px, 40vw); height: min(350px, 40vw);
  background: radial-gradient(circle, rgba(135,175,95,0.1) 0%, transparent 60%);
  border-radius: 50%; pointer-events: none;
  animation: heroGlowFloat 8s ease-in-out infinite;
}
.hero-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 50px 50px; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 15%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 15%, transparent 75%);
}
.hero-content { text-align: center; z-index: 2; position: relative; padding: 0 24px; }
.hero-emoji-wrap {
  display: inline-block; padding: 24px 64px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 24px;
  margin-bottom: 44px; position: relative; overflow: hidden; opacity: 0;
  animation: heroCardIn 1s ease 0.3s forwards;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
}
.hero-emoji-wrap::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(86,156,214,0.08) 0%, transparent 40%);
  pointer-events: none;
}
.hero-emoji-wrap::after {
  content: ''; position: absolute; bottom: 0; left: 10%; width: 80%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(86,156,214,0.4), transparent);
}
.hero-emoji {
  font-size: clamp(56px, 12vw, 100px); font-weight: 200; color: #fff;
  letter-spacing: -0.08em; line-height: 1; position: relative; z-index: 1;
  text-shadow: 0 0 30px rgba(86,156,214,0.3);
}
.hero-emoji .cursor {
  display: inline-block; animation: blink 1s steps(2) infinite;
  color: rgba(86,156,214,1); text-shadow: 0 0 20px rgba(86,156,214,0.6);
}
.hero-hello {
  font-size: clamp(16px, 3vw, 22px); font-weight: 300;
  color: rgba(255,255,255,0.75); letter-spacing: 0.06em;
  opacity: 0; animation: fadeUp 0.8s ease 0.8s forwards;
}
.scroll-hint {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.3); font-size: 11px; letter-spacing: 0.3em;
  text-transform: uppercase; opacity: 0; animation: fadeUp 1s ease 1.5s forwards;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.scroll-hint .arrow { font-size: 22px; animation: bounce 2s ease-in-out infinite; }
.scroll-gradient {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
  background: linear-gradient(to bottom, transparent 0%, rgba(10,10,18,0.5) 50%, rgba(10,10,18,0.9) 100%);
  pointer-events: none; opacity: 0; animation: fadeIn 1.5s ease 0.5s forwards;
}

/* ============ PAGE 2: Mint Desktop ============ */
.desktop-page {
  min-height: 100vh; min-height: 100dvh; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(145deg, #0a0a12 0%, #0f1a0f 30%, #0d1117 60%, #0a0a12 100%);
  padding: 40px 16px 0; position: relative; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always;
}
.desktop-page::before {
  content: ''; position: absolute; top: -100px; right: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(86,156,214,0.08) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.desktop-page::after {
  content: ''; position: absolute; bottom: -50px; left: -50px;
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(135,175,95,0.06) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.mint-panel {
  width: 100%; max-width: 740px; height: 36px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--desk-border); border-bottom: none;
  border-radius: 10px 10px 0 0;
  display: flex; align-items: center; padding: 0 16px; gap: 16px;
  font-size: 12px; color: rgba(255,255,255,0.5);
  opacity: 0; animation: fadeUp 0.6s ease 0.2s forwards;
}
.mint-panel-left { display: flex; align-items: center; gap: 12px; }
.mint-panel-center { margin: 0 auto; font-weight: 500; color: rgba(255,255,255,0.7); }
.mint-panel-right { display: flex; align-items: center; gap: 10px; }
.mint-menu-btn { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.6); }
.mint-logo-sm {
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, var(--mint-green), #4a7a2a);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff; font-weight: 700;
}
.mint-panel-right .icon { font-size: 11px; }
.desktop-area {
  width: 100%; max-width: 740px;
  background: var(--desk-surface);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-left: 1px solid var(--desk-border); border-right: 1px solid var(--desk-border);
  display: flex; flex-direction: row; min-height: 460px; position: relative;
  opacity: 0; animation: fadeUp 0.8s ease 0.4s forwards;
}
.dock {
  width: 64px; background: rgba(0,0,0,0.25);
  border-right: 1px solid var(--desk-border);
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 0; gap: 14px; flex-shrink: 0;
}
.dock-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; transition: all 0.25s ease;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.5); position: relative;
}
.dock-icon:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); color: #fff; transform: scale(1.1); }
.dock-icon.active { background: rgba(86,156,214,0.12); border-color: rgba(86,156,214,0.3); color: var(--term-blue); }
.dock-icon .badge {
  position: absolute; top: -2px; right: -2px; width: 14px; height: 14px;
  background: var(--term-red); border-radius: 50%; font-size: 8px; color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.workspace { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.avatar-section { display: flex; align-items: center; gap: 18px; padding-bottom: 20px; border-bottom: 1px solid var(--desk-border); }
.avatar-orb {
  width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; position: relative;
  border: 2px solid rgba(86,156,214,0.3); animation: pulseGlow 3s ease-in-out infinite;
}
.avatar-orb img { width: 100%; height: 100%; object-fit: cover; }
.avatar-orb::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events: none;
}
.welcome-text { flex: 1; min-width: 0; }
.welcome-text .user { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 2px; }
.welcome-text .status { font-size: 12px; color: rgba(255,255,255,0.4); display: flex; align-items: center; gap: 6px; }
.status-dot { width: 7px; height: 7px; background: var(--mint-green); border-radius: 50%; box-shadow: 0 0 6px var(--mint-green); animation: blink 2s steps(2) infinite; }

/* 第二页内的动态终端 */
.live-term {
  background: rgba(12,12,12,0.85); border: 1px solid #1f1f1f; border-radius: 8px; overflow: hidden;
  font-size: 13px; line-height: 1.65; flex: 1; min-height: 0;
}
.live-term-bar { background: #1a1a1a; padding: 7px 12px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid #1f1f1f; }
.live-term-dots { display: flex; gap: 6px; }
.live-term-dots span { width: 11px; height: 11px; border-radius: 50%; }
.live-term-dots .r { background: #ff5f56; } .live-term-dots .y { background: #ffbd2e; } .live-term-dots .g { background: #27c93f; }
.live-term-title { font-size: 11px; color: #555; margin: 0 auto; padding-right: 45px; }
.live-term-body { padding: 16px; color: #e8e8e8; }
.lt-line { display: block; white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
.lt-empty { height: 0.75em; }
.lt-user { color: var(--term-green); } .lt-at { color: var(--term-dim); }
.lt-host { color: var(--term-blue); } .lt-path { color: var(--term-yellow); }
.lt-dollar { color: var(--term-dim); } .lt-cmd { color: #e8e8e8; }
.lt-comment { color: var(--term-dim); font-style: italic; }
.lt-output { color: rgba(255,255,255,0.6); }
.lt-green { color: var(--term-green); } .lt-blue { color: var(--term-blue); }
.lt-yellow { color: var(--term-yellow); } .lt-purple { color: var(--term-purple); }
.lt-link { color: var(--term-blue); text-decoration: underline; }
.lt-cursor { display: inline-block; width: 7px; height: 14px; background: var(--term-green); vertical-align: middle; animation: blink 1s steps(2) infinite; }

.shortcuts { display: flex; gap: 16px; flex-wrap: wrap; }
.shortcut { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: rgba(255,255,255,0.5); transition: color 0.2s; font-size: 10px; }
.shortcut:hover { color: #fff; }
.shortcut-icon { width: 44px; height: 44px; border-radius: 11px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.2s; }
.shortcut:hover .shortcut-icon { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
.mint-taskbar {
  width: 100%; max-width: 740px; height: 40px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--desk-border); border-top: none; border-radius: 0 0 10px 10px;
  display: flex; align-items: center; padding: 0 12px; gap: 8px;
  font-size: 11px; color: rgba(255,255,255,0.4);
  opacity: 0; animation: fadeUp 0.6s ease 0.6s forwards;
}
.task-item { padding: 4px 10px; border-radius: 6px; transition: all 0.2s; }
.task-item.active { background: rgba(86,156,214,0.1); color: rgba(255,255,255,0.8); border-bottom: 2px solid var(--term-blue); }
.task-sep { color: rgba(255,255,255,0.15); margin: 0 2px; }
.task-clock { margin-left: auto; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.task-clock .date { color: rgba(255,255,255,0.3); }
.desktop-label { margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.15); letter-spacing: 0.1em; text-align: center; opacity: 0; animation: fadeIn 1s ease 1s forwards; }
.desktop-label a { color: rgba(255,255,255,0.2); text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,0.1); }

/* ============ PAGE 3: About ============ */
.about-page {
  min-height: 100vh; min-height: 100dvh; width: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #000; padding: 60px 24px;
  position: relative; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always;
}
.about-page::before {
  content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: min(600px, 70vw); height: min(600px, 70vw);
  background: radial-gradient(circle, rgba(86,156,214,0.06) 0%, transparent 65%);
  border-radius: 50%; pointer-events: none;
  animation: heroGlowPulse 8s ease-in-out infinite;
}
.about-card {
  max-width: 540px; width: 100%;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
  padding: 48px 40px; text-align: center; position: relative; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  opacity: 0; animation: fadeUp 0.8s ease 0.2s forwards;
}
.about-card::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(86,156,214,0.05) 0%, transparent 40%);
  pointer-events: none;
}
.about-card::after {
  content: ''; position: absolute; bottom: 0; left: 10%; width: 80%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(86,156,214,0.3), transparent);
}
.about-avatar {
  width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 24px;
  border: 2px solid rgba(86,156,214,0.25); animation: pulseGlow 4s ease-in-out infinite; position: relative;
}
.about-avatar img { width: 100%; height: 100%; object-fit: cover; }
.about-avatar::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events: none;
}
.about-name { font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 8px; position: relative; }
.about-tagline { font-size: 14px; color: rgba(255,255,255,0.45); margin-bottom: 32px; letter-spacing: 0.04em; position: relative; }
.about-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; position: relative; }
.about-link {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
  border: 1px solid rgba(255,255,255,0.1); border-radius: 999px;
  color: rgba(255,255,255,0.6); text-decoration: none; font-size: 13px; transition: all 0.3s ease;
}
.about-link:hover { color: #fff; border-color: rgba(86,156,214,0.4); background: rgba(86,156,214,0.08); }
.about-link svg { width: 16px; height: 16px; fill: currentColor; }
.about-footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 11px; color: rgba(255,255,255,0.2); position: relative; }
.about-footer a { color: rgba(255,255,255,0.3); text-decoration: none; }

@media (max-width: 640px) {
  .hero-emoji { font-size: 64px; }
  .hero-emoji-wrap { padding: 18px 48px; margin-bottom: 36px; border-radius: 20px; }
  .hero-hello { font-size: 15px; }
  .scroll-gradient { height: 80px; }
  .desktop-page { padding: 24px 10px 0; }
  .mint-panel { height: 32px; font-size: 10px; padding: 0 10px; gap: 10px; }
  .mint-panel-center { font-size: 11px; }
  .desktop-area { flex-direction: row; min-height: 360px; }
  .dock { width: 100%; height: 56px; flex-direction: row; border-right: none; border-bottom: 1px solid var(--desk-border); padding: 8px 12px; gap: 10px; overflow-x: auto; }
  .dock-icon { width: 36px; height: 36px; font-size: 16px; flex-shrink: 0; }
  .workspace { padding: 16px; }
  .avatar-orb { width: 52px; height: 52px; }
  .welcome-text .user { font-size: 14px; }
  .welcome-text .status { font-size: 11px; }
  .live-term-body { padding: 12px; font-size: 11px; }
  .live-term-bar { padding: 5px 10px; }
  .live-term-dots span { width: 9px; height: 9px; }
  .live-term-title { font-size: 9px; padding-right: 35px; }
  .shortcuts { gap: 12px; }
  .shortcut-icon { width: 38px; height: 38px; font-size: 17px; }
  .mint-taskbar { height: 36px; font-size: 10px; padding: 0 10px; }
  .task-item { padding: 3px 8px; }
  .about-card { padding: 36px 24px; border-radius: 16px; }
  .about-avatar { width: 64px; height: 64px; margin-bottom: 20px; }
  .about-name { font-size: 20px; }
  .about-tagline { font-size: 13px; }
  .about-link { padding: 8px 20px; font-size: 12px; }
}
@media (min-width: 1200px) {
  .hero-emoji { font-size: 96px; }
  .hero-emoji-wrap { padding: 28px 72px; }
  .hero-hello { font-size: 20px; }
}
</style>
</head>

<script>
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  var el = document.getElementById('clock');
  if (el) el.textContent = h + ':' + m;
  var d = document.getElementById('date-text');
  if (d) {
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    d.textContent = days[now.getDay()] + ' ' + (now.getMonth()+1) + '/' + now.getDate();
  }
}
setInterval(updateClock, 1000);
updateClock();

(function() {
  var lines = [
    {html:'<span class="lt-user">ayowait</span><span class="lt-at">@</span><span class="lt-host">github</span><span class="lt-dim">:</span><span class="lt-path">~</span><span class="lt-dollar">$</span> <span class="lt-cmd">neofetch</span>', delay: 300},
    {html:'', delay: 100},
    {html:'<span class="lt-green">       ___</span>        <span class="lt-blue">ayowait</span><span class="lt-dim">@</span><span class="lt-blue">github</span>', delay: 50},
    {html:'<span class="lt-green">      (.. \\</span>      <span class="lt-dim">-----------</span>', delay: 50},
    {html:'<span class="lt-green">      (___ |</span>      <span class="lt-yellow">OS</span>: Ayowait OS 1.0', delay: 50},
    {html:'<span class="lt-green">      _  __)</span>      <span class="lt-yellow">Host</span>: GitHub Pages', delay: 50},
    {html:'<span class="lt-green">     (____)</span>       <span class="lt-yellow">Kernel</span>: HTML5 + CSS3', delay: 50},
    {html:'<span class="lt-green">    (______)</span>      <span class="lt-yellow">Uptime</span>: <span id="lt-uptime">0s</span>', delay: 50},
    {html:'<span class="lt-green">   ___|___|__</span>     <span class="lt-yellow">Shell</span>: bash 5.2', delay: 50},
    {html:'<span class="lt-green">  (___    ___)</span>    <span class="lt-yellow">Editor</span>: VS Code + Vim', delay: 50},
    {html:'<span class="lt-green">  (___|  |___)</span>    <span class="lt-yellow">Theme</span>: Dark / Minimal', delay: 50},
    {html:'<span class="lt-green">  (___|  |___)</span>    <span class="lt-yellow">Coffee</span>: <span class="lt-green">always</span>', delay: 50},
    {html:'', delay: 100},
    {html:'<span class="lt-user">ayowait</span><span class="lt-at">@</span><span class="lt-host">github</span><span class="lt-dim">:</span><span class="lt-path">~</span><span class="lt-dollar">$</span> <span class="lt-cursor"></span>', delay: 300},
  ];

  var container = document.getElementById('live-term');
  if (!container) return;
  var started = false;
  var lineIdx = 0;

  function typeNext() {
    if (lineIdx >= lines.length) return;
    var data = lines[lineIdx];
    var div = document.createElement('div');
    div.className = 'lt-line';
    div.innerHTML = data.html;
    if (data.html === '') div.className = 'lt-line lt-empty';
    container.appendChild(div);
    lineIdx++;
    setTimeout(typeNext, data.delay);
  }

  function start() {
    if (started) return;
    started = true;
    typeNext();
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) start();
      });
    }, { threshold: 0.3 });
    observer.observe(container);
  } else {
    start();
  }

  var startTime = Date.now();
  setInterval(function() {
    var el = document.getElementById('lt-uptime');
    if (el) {
      var s = Math.floor((Date.now() - startTime) / 1000);
      el.textContent = s + 's';
    }
  }, 1000);
})();
</script>
